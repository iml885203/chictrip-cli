[package]
name = "chictrip-cli"
version = "0.2.0"
edition = "2024"
description = "Unofficial command-line client and MCP server for ChicTrip"
repository = "https://github.com/iml885203/chictrip-cli"
license = "MIT"

[[bin]]
name = "chictrip"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2"

[dev-dependencies]
httpmock = "0.8"
